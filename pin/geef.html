<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>Glans</title>
<script>
(async()=>{const f=new URLSearchParams(location.search).get("f");if(!f||!/^[\w-]+\.(mp4|jpg|png)$/.test(f)||!window.opener)return;
const b=await (await fetch("../media/social/"+f)).arrayBuffer();
window.opener.postMessage({glans:f,buf:b},"*");document.body.textContent="Klaar";setTimeout(()=>close(),800);})();
</script>
